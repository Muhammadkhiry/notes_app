name: note_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.6
  injectable: ^3.0.0
  flutter_bloc: ^9.1.1
  meta: ^1.19.0
  modal_progress_hud_nsn: ^0.5.1
  intl: ^0.20.3
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: 2.4.13
  flutter_launcher_icons: ^0.14.4
flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true

  android_12:
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/trash-bin.png
    - assets/undraw_idea_hz8b.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/poppins_family/Poppins-Regular.ttf